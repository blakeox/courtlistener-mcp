version: 2
updates:
  # Keep npm dependencies up to date (always land on dev; promote to main via PR)
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      time: '09:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      dev-deps:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - '*'

  # Keep GitHub Actions up to date (always land on dev; promote to main via PR)
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      time: '09:30'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
      - github-actions
