name: Release Validation

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  validate-release:
    name: Comprehensive Release Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version consistency
        run: node scripts/build/version-check.js

      - name: Format check
        run: pnpm run format:check

      - name: Run shared local gate
        run: pnpm run ci:local-gate

      - name: Verify Cloudflare IaC ownership boundary
        run: pnpm run cloudflare:check:iac

      - name: Profile Cloudflare Worker startup
        run: pnpm run cloudflare:check:startup

      - name: Verify Worker platform surface
        run: pnpm run cloudflare:check:surface

      - name: Verify deployed Wrangler binding types
        run: pnpm run cloudflare:check:types

      - name: Verify Cloudflare environment isolation
        run: pnpm run cloudflare:check:environments -- --require-provisioned

      - name: Verify live Cloudflare inventory
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READONLY_API_TOKEN }}
        run: pnpm run cloudflare:check:live

      - name: Typecheck Workers runtime harness
        run: pnpm exec tsc -p test/tsconfig.workers.json --noEmit

      - name: Verify generated Workers bindings
        run: pnpm exec wrangler types test/worker-configuration.d.ts --config wrangler.mcp.test.jsonc --env-interface MpcTestEnv --check

      - name: Run Workers runtime tests
        run: pnpm run test:workers

      - name: Install Chromium for auth browser validation
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser + integration release suite
        run: |
          echo "🧪 Running browser and integration release coverage..."
          pnpm run test:integration
          pnpm run test:spa:e2e:auth

      - name: Hosted OAuth release gate
        env:
          REMOTE_SERVER_URL: ${{ secrets.REMOTE_SERVER_URL }}
        run: pnpm run ci:auth-release-gate

      - name: MCP v2 contract validation
        run: |
          echo "🔍 Running direct MCP v2 contract validation..."

          pnpm run ci:test:mcp-v2:extended

          # Test all available tools
          pnpm run test:mcp:tool list_courts
          pnpm run test:mcp:tool search_cases '{"query": "constitutional"}'

      - name: Performance hardening gates
        env:
          PERF_GATE_POLICY_MODE: fail
          PERF_GATE_REQUIRE_FILES: 'true'
        run: |
          echo "⚡ Running release performance hardening gates..."
          mkdir -p performance-data
          LOCAL_WORKERS_CONFIG=test pnpm run dev:workers > performance-data/release-gate-workers.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if LOCAL_HEALTH_URL=http://127.0.0.1:8787 LOCAL_HEALTH_TIMEOUT_MS=1000 node scripts/dev/check-local-health.mjs >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          LOCAL_HEALTH_URL=http://127.0.0.1:8787 node scripts/dev/check-local-health.mjs >/dev/null

          pnpm run ci:load-profile-suite -- --light --base-url http://127.0.0.1:8787 --output performance-data/load-profile-baseline.json
          pnpm run ci:load-profile-suite -- --light --base-url http://127.0.0.1:8787 --output performance-data/load-profile-current.json
          pnpm run ci:perf-gate -- performance-data/load-profile-baseline.json performance-data/load-profile-current.json
          pnpm run ci:hardening:soak-leak-checks -- --light --base-url http://127.0.0.1:8787 --output performance-data/hardening-soak-leak.json

      - name: Test against multiple environments
        run: |
          echo "🌍 Testing against multiple environments..."

          # Test local build
          echo "Testing local build..."
          pnpm run test:mcp

          # Test remote deployment if available
          if [ -n "$REMOTE_SERVER_URL" ]; then
            echo "Testing remote deployment..."
            REMOTE_MCP_URL="$(node scripts/resolve-remote-endpoints.js "$REMOTE_SERVER_URL" --field mcpUrl)"
            SERVER_URL="$REMOTE_MCP_URL" pnpm run test:mcp
          fi

      - name: Generate release validation report
        run: |
          echo "📋 Generating release validation report..."
          TOOL_COUNT=$(node -e "const fs=require('fs');const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));const tools=manifest.capabilities?.tools?.tools;console.log(Array.isArray(tools)?tools.length:0)")

          cat > release-validation-report.md << EOF
          # Release Validation Report

          **Version:** ${{ github.ref_name }}
          **Generated:** $(date)
          **Commit:** ${{ github.sha }}

          ## Test Results Summary

          - ✅ Version consistency check
          - ✅ Build successful  
          - ✅ Full test suite passed
          - ✅ MCP v2 contract validation passed
          - ✅ Performance hardening gates
          - ✅ Multi-environment testing

          ## MCP Protocol Compliance

          - Generated MCP catalog: ${TOOL_COUNT} tools
          - Tool definitions and output schemas validated by the shared local gate
          - Direct MCP v2 protocol probes recorded in the workflow logs

          ## Performance Metrics

          \`\`\`
          $(node -e "const fs=require('fs');const p='performance-data/load-profile-current.json';if(!fs.existsSync(p)){process.exit(0)};const d=JSON.parse(fs.readFileSync(p,'utf8'));console.log(JSON.stringify(d.summary||{},null,2));")
          \`\`\`

          ## Ready for Release ✅

          This release has passed all validation checks and is ready for deployment.
          EOF

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-validation-${{ github.ref_name }}
          path: |
            release-validation-report.md
            performance-data/load-profile-baseline.json
            performance-data/load-profile-current.json
            performance-data/hardening-soak-leak.json
            performance-data/release-gate-workers.log
            test-output/

      - name: Comment on release
        if: github.event_name == 'release'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('release-validation-report.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.payload.release.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs: validate-release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
      id-token: write
    environment: npm-publish
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - name: Configure npm publish auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
            echo "Using NPM_TOKEN repository secret for npm publish."
          else
            echo "No NPM_TOKEN secret configured; attempting npm trusted publishing via GitHub OIDC."
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub release
    needs: publish-npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    environment: github-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true

  deployment-ready:
    name: Deployment Ready Check
    runs-on: ubuntu-latest
    needs: validate-release
    if: github.event_name == 'release'

    steps:
      - name: Deployment readiness confirmation
        run: |
          echo "🚀 Release ${{ github.ref_name }} is validated and ready for deployment!"
          echo ""
          echo "✅ All tests passed"
          echo "✅ MCP v2 contract validation successful"
          echo "✅ Performance regression checks passed"
          echo "✅ Multi-environment testing completed"
          echo ""
          echo "This release can be safely deployed to production."
