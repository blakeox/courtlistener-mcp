name: Continuous Integration

on:
  push:
    branches: [main, master, dev, test]
  pull_request:
    branches: [main, master, dev, test]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  detect-relevant-changes:
    name: Detect Relevant PR Changes
    runs-on: ubuntu-latest
    outputs:
      auth_related: ${{ steps.finalize.outputs.auth_related }}
      worker_related: ${{ steps.finalize.outputs.worker_related }}
      mcp_related: ${{ steps.finalize.outputs.mcp_related }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Filter changed paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            auth_related:
              - 'src/auth/**'
              - 'src/server/worker-auth-*.ts'
              - 'src/server/worker-oauth-*.ts'
              - 'src/server/worker-ui-session-runtime.ts'
              - 'src/server/worker-core-routes.ts'
              - 'src/server/worker-security.ts'
              - 'src/server/oauth-diagnostics.ts'
              - 'src/security/**'
              - 'src/web-spa/**'
              - 'src/infrastructure/auth-policy-matrix.ts'
              - 'src/infrastructure/config.ts'
              - 'scripts/reports/auth-release-gate.js'
              - 'scripts/testing/e2e-remote-oauth-handshake.mjs'
              - 'scripts/testing/probe-production-approve-contract.ts'
              - 'src/server/hosted-auth-html-security.ts'
              - 'scripts/testing/spa-auth-suites.mjs'
              - 'scripts/testing/run-spa-auth-*.mjs'
              - 'docs/repo/AUTH_START_INTEGRATION.md'
              - 'playwright.config.ts'
              - 'README.md'
              - 'test/unit/test-hosted-auth-html-security.ts'
              - 'test/unit/test-worker-auth-handoff-routes.ts'
              - 'test/unit/test-worker-oauth-authorize.ts'
              - 'test/unit/test-worker-core-routes.ts'
              - 'test/unit/test-worker-ui-session-runtime.ts'
              - 'test/unit/test-worker-security.ts'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
            worker_related:
              - 'src/server/**'
              - 'src/infrastructure/**'
              - 'src/security/**'
              - 'src/worker-edge.ts'
              - 'src/worker-mcp.ts'
              - 'src/worker-auth-limiter.ts'
              - 'src/worker/**'
              - 'wrangler.edge.jsonc'
              - 'wrangler.mcp.jsonc'
              - 'wrangler.mcp.test.jsonc'
              - 'wrangler.auth-limiter.jsonc'
              - 'vitest.workers.config.ts'
              - 'test/tsconfig.workers.json'
              - 'test/worker-configuration.d.ts'
              - 'test/workers/**'
              - 'scripts/dev/run-local-workers.mjs'
              - 'scripts/reports/analyze-worker-bundle.mjs'
              - 'scripts/cloudflare/check-worker-surface.mjs'
              - 'docs/repo/WORKER_SPLIT.md'
              - 'docs/repo/WORKER_BUNDLE_AUDIT.md'
              - 'src/index.ts'
              - 'scripts/reports/runtime-safety-gate.js'
              - 'scripts/reports/release-readiness-gate.js'
              - 'scripts/reports/auth-release-gate.js'
              - 'scripts/testing/e2e-remote-oauth-handshake.mjs'
              - 'scripts/testing/probe-production-approve-contract.ts'
              - 'src/server/hosted-auth-html-security.ts'
              - 'test/unit/test-worker-*.ts'
              - 'test/integration/test-http-v2.ts'
              - 'test/integration/test-mcp-protocol.ts'
              - 'test/tools/runtime-parity-certification.ts'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
            mcp_related:
              - 'src/**'
              - 'scripts/dev/**'
              - 'scripts/resolve-remote-endpoints.js'
              - 'test/integration/test-mcp-protocol.ts'
              - 'test/tools/runtime-parity-certification.ts'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'

      - name: Default all filters to true outside PRs
        if: github.event_name != 'pull_request'
        id: defaults
        run: |
          {
            echo "auth_related=true"
            echo "worker_related=true"
            echo "mcp_related=true"
          } >> "$GITHUB_OUTPUT"

      - name: Finalize filter outputs
        id: finalize
        env:
          AUTH_FILTER: ${{ steps.filter.outputs.auth_related }}
          WORKER_FILTER: ${{ steps.filter.outputs.worker_related }}
          MCP_FILTER: ${{ steps.filter.outputs.mcp_related }}
          AUTH_DEFAULT: ${{ steps.defaults.outputs.auth_related }}
          WORKER_DEFAULT: ${{ steps.defaults.outputs.worker_related }}
          MCP_DEFAULT: ${{ steps.defaults.outputs.mcp_related }}
        run: |
          {
            echo "auth_related=${AUTH_FILTER:-$AUTH_DEFAULT}"
            echo "worker_related=${WORKER_FILTER:-$WORKER_DEFAULT}"
            echo "mcp_related=${MCP_FILTER:-$MCP_DEFAULT}"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Smoke Tests
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version consistency check
        run: pnpm run ci:version-check

      - name: Format check
        run: pnpm run format:check

      - name: Lint (critical files)
        run: pnpm run lint:critical

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test:unit

  full-validation:
    name: Full Validation
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (full src - non-blocking)
        run: pnpm run lint:src
        continue-on-error: true

      - name: Run shared local gate
        run: pnpm run ci:local-gate

      - name: Verify Cloudflare IaC ownership boundary
        run: pnpm run cloudflare:check:iac

      - name: Profile Cloudflare Worker startup
        run: pnpm run cloudflare:check:startup

      - name: Verify Worker platform surface
        run: pnpm run cloudflare:check:surface

      - name: Verify deployed Wrangler binding types
        run: pnpm run cloudflare:check:types

      - name: Verify Cloudflare environment isolation
        run: pnpm run cloudflare:check:environments

      - name: Typecheck Workers runtime harness
        run: pnpm exec tsc -p test/tsconfig.workers.json --noEmit

      - name: Verify generated Workers bindings
        run: pnpm exec wrangler types test/worker-configuration.d.ts --config wrangler.mcp.test.jsonc --env-interface MpcTestEnv --check

      - name: Run Workers runtime tests
        run: pnpm run test:workers

      - name: Run SPA unit tests
        run: pnpm run test:spa

      - name: Install Chromium for SPA design smoke
        run: pnpm exec playwright install --with-deps chromium

      - name: Run SPA design smoke tests
        run: pnpm run test:spa:design

      - name: Accessibility static gate
        run: pnpm run ci:check:a11y

      - name: Run SPA accessibility tests
        run: pnpm run test:spa:a11y

      - name: Run SPA accessibility smoke tests
        run: pnpm run test:spa:a11y:smoke

      - name: Run integration tests
        run: pnpm run test:integration

      - name: Enforce coverage thresholds
        run: pnpm run coverage:check

      - name: Run coverage (generate reports)
        if: always()
        run: pnpm run coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-node-24
          path: |
            coverage/
            coverage/lcov.info
          retention-days: 7

      - name: Append coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            BRANCH=$(jq '.total.branches.pct' coverage/coverage-summary.json || echo 0)
            LINES=$(jq '.total.lines.pct' coverage/coverage-summary.json || echo 0)
            FUNCS=$(jq '.total.functions.pct' coverage/coverage-summary.json || echo 0)
            STMTS=$(jq '.total.statements.pct' coverage/coverage-summary.json || echo 0)
            {
              echo "## Coverage Summary (Node 24)"
              echo "- Lines: ${LINES}%"
              echo "- Statements: ${STMTS}%"
              echo "- Functions: ${FUNCS}%"
              echo "- Branches: ${BRANCH}%"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage summary JSON found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run performance regression gate
        env:
          PERF_BASELINE_FILE: ${{ vars.PERF_BASELINE_FILE }}
          PERF_CURRENT_FILE: ${{ vars.PERF_CURRENT_FILE }}
          PERF_COMMIT_SHA: ${{ github.sha }}
          PERF_RUNTIME_MODE: node-24
        run: pnpm run ci:perf-gate

      - name: Run MCP protocol validation
        run: pnpm run test:mcp

      - name: Run runtime parity smoke tests
        run: pnpm run test:infra:parity

  browser-auth:
    name: Browser Auth CI
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    needs: detect-relevant-changes
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        needs.detect-relevant-changes.outputs.auth_related == 'true'
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build SPA assets for Playwright
        run: pnpm run generate:web:spa

      - name: Run SPA auth browser tests
        run: pnpm run test:spa:e2e:auth

  hardening-release-gates:
    name: Hardening Release Gates (${{ matrix.gate }})
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    needs: detect-relevant-changes
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        needs.detect-relevant-changes.outputs.auth_related == 'true' ||
        needs.detect-relevant-changes.outputs.worker_related == 'true'
      }}
    strategy:
      fail-fast: false
      matrix:
        gate:
          - protocol-contract
          - auth-security-matrix
          - auth-release-gate
          - stress-reliability
          - runtime-parity-security-async
          - release-readiness
          - startup-diagnostics
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Install Chromium for SPA auth browser gates
        if: matrix.gate == 'auth-release-gate'
        run: pnpm exec playwright install --with-deps chromium

      - name: Resolve gate policy
        id: gate_policy
        run: |
          strict=false
          policy=warn
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/master" || "${GITHUB_REF}" == refs/heads/release/* || "${GITHUB_REF}" == refs/tags/v* ]]; then
              strict=true
              policy=fail
            fi
          fi
          echo "strict_mode=${strict}" >> "$GITHUB_OUTPUT"
          echo "policy_mode=${policy}" >> "$GITHUB_OUTPUT"

      - name: Run selected release policy gate
        env:
          PERF_GATE_POLICY_MODE: ${{ steps.gate_policy.outputs.policy_mode }}
          PERF_GATE_REQUIRE_FILES: ${{ steps.gate_policy.outputs.strict_mode }}
          REMOTE_SERVER_URL: ${{ secrets.REMOTE_SERVER_URL }}
        run: |
          case "${{ matrix.gate }}" in
            protocol-contract)
              # Live MCP stdio tests run in full-validation and mcp-compliance; avoid
              # parallel CourtListener calls that flake when duplicated here.
              pnpm exec tsx --test test/unit/test-protocol-governance.ts
              ;;
            auth-security-matrix)
              pnpm exec tsx --test test/unit/test-mcp-gateway-auth.ts
              pnpm exec tsx --test test/unit/test-worker-security.ts
              ;;
            auth-release-gate)
              pnpm run ci:auth-release-gate
              ;;
            startup-diagnostics)
              pnpm exec tsx --test --test-force-exit test/integration/test-http-v2.ts
              ;;
            stress-reliability)
              mkdir -p performance-data
              LOCAL_WORKERS_CONFIG=test pnpm run dev:workers > performance-data/local-gate-workers.log 2>&1 &
              SERVER_PID=$!
              cleanup() {
                kill "$SERVER_PID" >/dev/null 2>&1 || true
              }
              trap cleanup EXIT

              for _ in $(seq 1 30); do
                if LOCAL_HEALTH_URL=http://127.0.0.1:8787 LOCAL_HEALTH_TIMEOUT_MS=1000 node scripts/dev/check-local-health.mjs >/dev/null 2>&1; then
                  break
                fi
                sleep 1
              done
              LOCAL_HEALTH_URL=http://127.0.0.1:8787 node scripts/dev/check-local-health.mjs >/dev/null

              pnpm run ci:load-profile-suite -- --light --base-url http://127.0.0.1:8787 --output performance-data/load-profile-baseline.json
              pnpm run ci:load-profile-suite -- --light --base-url http://127.0.0.1:8787 --output performance-data/load-profile-current.json
              pnpm run ci:perf-gate -- performance-data/load-profile-baseline.json performance-data/load-profile-current.json

              if [[ "${{ steps.gate_policy.outputs.strict_mode }}" == "true" ]]; then
                pnpm run ci:hardening:soak-leak-checks -- --light --base-url http://127.0.0.1:8787 --output performance-data/hardening-soak-leak.json
              else
                pnpm run ci:hardening:soak-leak-checks -- --light --warn-only --base-url http://127.0.0.1:8787 --output performance-data/hardening-soak-leak.json
                fi
              ;;
            runtime-parity-security-async)
              RUNTIME_SAFETY_GATE_POLICY_MODE=${{ steps.gate_policy.outputs.policy_mode }} pnpm run ci:runtime-safety-gate
              ;;
            release-readiness)
              mkdir -p performance-data test-output
              LOCAL_WORKERS_CONFIG=test pnpm run dev:workers > performance-data/local-release-readiness-workers.log 2>&1 &
              SERVER_PID=$!
              cleanup() {
                kill "$SERVER_PID" >/dev/null 2>&1 || true
              }
              trap cleanup EXIT

              for _ in $(seq 1 30); do
                if LOCAL_HEALTH_URL=http://127.0.0.1:8787 LOCAL_HEALTH_TIMEOUT_MS=1000 node scripts/dev/check-local-health.mjs >/dev/null 2>&1; then
                  break
                fi
                sleep 1
              done
              LOCAL_HEALTH_URL=http://127.0.0.1:8787 node scripts/dev/check-local-health.mjs >/dev/null

              RELEASE_READINESS_GATE_POLICY_MODE=${{ steps.gate_policy.outputs.policy_mode }} \
              RUNTIME_SAFETY_GATE_POLICY_MODE=${{ steps.gate_policy.outputs.policy_mode }} \
              pnpm run ci:release-readiness-gate -- --light --base-url http://127.0.0.1:8787
              ;;
            *)
              echo "Unknown gate: ${{ matrix.gate }}" >&2
              exit 1
              ;;
          esac

      - name: Upload hardening gate artifacts
        if: always() && matrix.gate == 'stress-reliability'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hardening-release-gates-${{ matrix.gate }}
          path: |
            performance-data/load-profile-baseline.json
            performance-data/load-profile-current.json
            performance-data/hardening-soak-leak.json
            performance-data/local-gate-workers.log
          retention-days: 7

      - name: Upload runtime parity gate artifacts
        if: always() && matrix.gate == 'runtime-parity-security-async'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hardening-release-gates-${{ matrix.gate }}
          path: |
            test-output/runtime-parity/certification-report.json
            test-output/runtime-parity/runtime-safety-gate.json
          retention-days: 7

      - name: Upload release readiness gate artifacts
        if: always() && matrix.gate == 'release-readiness'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hardening-release-gates-${{ matrix.gate }}
          path: |
            test-output/release-readiness/release-readiness-gate.json
            test-output/runtime-parity/certification-report.json
            test-output/runtime-parity/runtime-safety-gate.json
            performance-data/load-profile-baseline.json
            performance-data/load-profile-current.json
            performance-data/local-release-readiness-workers.log
          retention-days: 7

  mcp-compliance:
    name: MCP Protocol Compliance
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    needs: [detect-relevant-changes, test]
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        needs.detect-relevant-changes.outputs.mcp_related == 'true'
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Comprehensive MCP validation
        env:
          REMOTE_SERVER_URL: ${{ secrets.REMOTE_SERVER_URL }}
        run: |
          echo "Running comprehensive MCP protocol validation..."
          pnpm run test:mcp
          if [ -n "$REMOTE_SERVER_URL" ]; then
            REMOTE_MCP_URL="$(node scripts/resolve-remote-endpoints.js "$REMOTE_SERVER_URL" --field mcpUrl)"
            SERVER_URL="$REMOTE_MCP_URL" pnpm run test:mcp
          fi

      - name: Generate MCP compliance report
        run: |
          {
            echo "# MCP Protocol Compliance Report"
            echo ""
            echo "Generated on: $(date)"
            echo ""
            echo "## Test Results"
            if [ -f test-output/mcp-validation.log ]; then
              echo "\`\`\`"
              cat test-output/mcp-validation.log
              echo "\`\`\`"
            fi
          } > mcp-compliance-report.md

      - name: Upload compliance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-compliance-report
          path: mcp-compliance-report.md

  remote-server-test:
    name: Remote Server Validation
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        vars.ENABLE_REMOTE_SERVER_VALIDATION == 'true'
      }}
    needs: [full-validation, mcp-compliance]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test remote Cloudflare Workers deployment
        env:
          REMOTE_SERVER_URL: ${{ secrets.REMOTE_SERVER_URL }}
        run: |
          echo "Testing remote server deployment..."
          REMOTE_HEALTH_URL="$(node scripts/resolve-remote-endpoints.js "$REMOTE_SERVER_URL" --field healthUrl)"
          REMOTE_MCP_URL="$(node scripts/resolve-remote-endpoints.js "$REMOTE_SERVER_URL" --field mcpUrl)"
          curl -f "$REMOTE_HEALTH_URL" || echo "Remote server not accessible"
          SERVER_URL="$REMOTE_MCP_URL" pnpm run test:mcp

      - name: Performance benchmark against remote
        env:
          REMOTE_SERVER_URL: ${{ secrets.REMOTE_SERVER_URL }}
        run: |
          echo "Running performance benchmarks..."
          mkdir -p performance-data
          REMOTE_BASE_URL="$(node scripts/resolve-remote-endpoints.js "$REMOTE_SERVER_URL" --field baseUrl)"
          pnpm run ci:load-profile-suite -- --light --base-url "$REMOTE_BASE_URL" --output performance-data/remote-ci.json

  security-check:
    name: Security & Code Quality
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run security audit
        run: pnpm audit --audit-level=moderate

      - name: Check for sensitive data in logs
        run: |
          pnpm run build
          timeout --kill-after=5s 10s pnpm start > security-startup.log 2>&1 || true
          if grep -iE "api\.key|token|secret|password" security-startup.log; then
            exit 1
          fi
          echo "No sensitive data found in logs"

      - name: Validate MCP server security
        run: |
          pnpm run build
          printf '%s' '{"invalid": "json"' > malformed-input.json
          timeout --kill-after=5s 5s pnpm start < malformed-input.json > malformed-input.log 2>&1 || true
          echo "Server handles malformed input gracefully"

  required-checks-gate:
    name: Required Checks Gate
    runs-on: ubuntu-latest
    needs: [test, full-validation, hardening-release-gates, mcp-compliance, security-check]
    if: always()
    steps:
      - name: Summarize upstream job results
        run: |
          echo "Test Suite result: ${{ needs.test.result }}"
          echo "Full Validation result: ${{ needs['full-validation'].result }}"
          echo "Hardening Release Gates result: ${{ needs['hardening-release-gates'].result }}"
          echo "MCP Compliance result: ${{ needs['mcp-compliance'].result }}"
          echo "Security & Code Quality result: ${{ needs['security-check'].result }}"
      - name: Fail if any required check failed
        if: >-
          ${{
            needs.test.result != 'success' ||
            needs['full-validation'].result != 'success' ||
            contains(fromJSON('["failure","cancelled"]'), needs['hardening-release-gates'].result) ||
            contains(fromJSON('["failure","cancelled"]'), needs['mcp-compliance'].result) ||
            needs['security-check'].result != 'success'
          }}
        run: |
          echo "One or more required checks failed" >&2
          exit 1
      - name: All required checks passed
        if: >-
          ${{
            needs.test.result == 'success' &&
            needs['full-validation'].result == 'success' &&
            !contains(fromJSON('["failure","cancelled"]'), needs['hardening-release-gates'].result) &&
            !contains(fromJSON('["failure","cancelled"]'), needs['mcp-compliance'].result) &&
            needs['security-check'].result == 'success'
          }}
        run: echo "All required checks passed"
