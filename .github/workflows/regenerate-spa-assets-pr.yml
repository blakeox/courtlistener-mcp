name: Regenerate SPA Assets (Dependabot PR)

on:
  pull_request_target:
    branches: [dev]
    paths:
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: write
  pull-requests: read

jobs:
  regenerate:
    name: Regenerate spa-assets.ts on PR branch
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate embedded SPA assets
        run: pnpm run generate:web:spa

      - name: Commit regenerated assets
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: 'chore: regenerate spa-assets for dependency update'
          file_pattern: src/web/spa-assets.ts
