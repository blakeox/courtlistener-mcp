name: E2E Hosted OAuth Handshake

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-oauth-handshake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-oauth-handshake:
    name: End-to-End Hosted OAuth Handshake
    runs-on: ubuntu-latest

    env:
      OAUTH_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      OAUTH_CLIENT_ID: ${{ secrets.E2E_OAUTH_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify required E2E secrets
        run: |
          missing=0
          if [ -z "${OAUTH_BASE_URL}" ]; then
            echo "Missing secret: E2E_BASE_URL"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "E2E target host: $(node -e "console.log(new URL(process.env.OAUTH_BASE_URL).host)")"

      - name: Validate E2E OAuth target exposes hosted-auth readiness
        run: pnpm run test:e2e:oauth-target

      - name: Run hosted OAuth handshake probe
        run: pnpm run test:e2e:oauth-remote

      - name: Run OAuth approve contract probe
        run: pnpm run test:e2e:oauth-approve-contract
