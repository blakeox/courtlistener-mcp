name: E2E Hosted OAuth Handshake

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-auth-chat-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-auth-chat-flow:
    name: End-to-End Hosted OAuth Handshake
    runs-on: ubuntu-latest

    env:
      OAUTH_BASE_URL: ${{ secrets.E2E_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          if ! pnpm install --frozen-lockfile --dry-run > /dev/null 2>&1; then
            pnpm install
          else
            pnpm install --frozen-lockfile
          fi

      - name: Verify required E2E secrets
        run: |
          missing=0
          if [ -z "${OAUTH_BASE_URL}" ]; then
            echo "Missing secret: E2E_BASE_URL"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run hosted OAuth handshake probe
        run: pnpm run test:e2e:oauth-remote
