name: Main Promotion Policy

on:
  pull_request_target:
    branches: [main]

concurrency:
  group: main-promotion-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  require-dev-promotion:
    name: Require dev promotion
    if: github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, nuc, courtlistener-mcp]
    steps:
      - name: Enforce approved promotion sources
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            dev|promote-dev-to-main-*)
              ;;
            dependabot/*)
              echo "::error::Dependabot PRs must target dev, not main. Retarget the PR base to dev or merge dependency updates through dev and promote."
              exit 1
              ;;
            *)
              echo "::error::Pull requests into main must come from dev or an approved promote-dev-to-main-* branch. Promote validated dev into main instead of merging feature branches directly."
              exit 1
              ;;
          esac
