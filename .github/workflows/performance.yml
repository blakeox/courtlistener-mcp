name: Performance Monitoring

on:
  push:
    branches: [main] # Keep automatic performance monitoring on the production branch
  pull_request:
    branches: [main] # Run on PRs targeting main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: false
        default: 'remote'
        type: choice
        options:
          - local
          - remote
          - both

permissions:
  contents: read
  issues: write

jobs:
  performance-monitoring:
    name: Performance Monitoring
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Run performance tests
        env:
          REMOTE_SERVER_URL: ${{ secrets.REMOTE_SERVER_URL }}
          TEST_ENVIRONMENT: ${{ github.event.inputs.environment || 'remote' }}
        run: |
          echo "⚡ Running performance monitoring for $TEST_ENVIRONMENT environment(s)..."

          mkdir -p performance-data
          REMOTE_BASE_URL="$(node scripts/resolve-remote-endpoints.js "$REMOTE_SERVER_URL" --field baseUrl)"

          start_local_workers() {
            LOCAL_WORKERS_CONFIG=test pnpm run dev:workers > performance-data/local-workers.log 2>&1 &
            LOCAL_WORKERS_PID=$!
            for attempt in $(seq 1 30); do
              if LOCAL_HEALTH_URL=http://127.0.0.1:8787 LOCAL_HEALTH_TIMEOUT_MS=1000 node scripts/dev/check-local-health.mjs >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            echo "Local Workers failed readiness; see performance-data/local-workers.log" >&2
            return 1
          }

          stop_local_workers() {
            if [ -n "${LOCAL_WORKERS_PID:-}" ]; then
              kill "$LOCAL_WORKERS_PID" 2>/dev/null || true
              wait "$LOCAL_WORKERS_PID" 2>/dev/null || true
            fi
          }

          run_profile() {
            local base_url="$1"
            local output_path="$2"
            local log_path="$3"
            pnpm run ci:load-profile-suite -- --light --base-url "$base_url" --output "$output_path" >"$log_path"
          }

          case "$TEST_ENVIRONMENT" in
            "local")
              echo "Testing local server performance..."
              start_local_workers
              trap stop_local_workers EXIT
              run_profile http://127.0.0.1:8787 performance-data/local.json performance-data/local.txt
              ;;
            "remote")
              echo "Testing remote server performance..."
              run_profile "$REMOTE_BASE_URL" performance-data/remote.json performance-data/remote.txt
              ;;
            "both")
              echo "Testing both local and remote server performance..."
              start_local_workers
              trap stop_local_workers EXIT
              run_profile http://127.0.0.1:8787 performance-data/local.json performance-data/local.txt
              run_profile "$REMOTE_BASE_URL" performance-data/remote.json performance-data/remote.txt
              ;;
          esac

      - name: Analyze performance trends
        run: |
          echo "📊 Analyzing performance trends..."

          # Create performance summary
          cat > performance-summary.md << EOF
          # Performance Monitoring Report

          **Date:** $(date)
          **Environment:** ${{ github.event.inputs.environment || 'remote' }}
          **Commit:** ${{ github.sha }}

          ## Latest Performance Results

          \`\`\`
          $(find performance-data -name "*.json" -exec jq -c '.summary' {} \; | head -50)
          \`\`\`

          ## Performance Alerts

          $(node scripts/performance/analyze-performance.js performance-data/ || echo "No performance issues detected ✅")

          EOF

      - name: Check for performance regressions
        run: |
          echo "🔍 Checking for performance regressions..."

          # Download previous performance data if available
          if [ -n "${{ secrets.PERFORMANCE_BASELINE_URL }}" ]; then
            curl -s "${{ secrets.PERFORMANCE_BASELINE_URL }}" > baseline.json || echo "No baseline available"

            CURRENT_JSON="$(find performance-data -name '*.json' | head -1)"
            if [ -f baseline.json ] && [ -n "$CURRENT_JSON" ]; then
              node scripts/performance/compare-performance.js baseline.json "$CURRENT_JSON" || echo "Performance comparison completed"
            fi
          fi

      - name: Upload performance data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-monitoring-${{ github.run_number }}
          path: |
            performance-data/
            performance-summary.md
          retention-days: 30

      - name: Create issue for performance regression
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const title = `🚨 Performance Regression Detected - ${new Date().toISOString().split('T')[0]}`;
            const body = `
            A performance regression has been detected during automated monitoring.

            **Environment:** ${{ github.event.inputs.environment || 'remote' }}
            **Commit:** ${{ github.sha }}
            **Workflow:** ${{ github.workflow }}
            **Run:** ${{ github.run_number }}

            Please review the performance data and investigate potential causes.

            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'monitoring,regression',
              per_page: 1,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['performance', 'regression', 'monitoring']
            });

  health-check:
    name: Remote Server Health Check
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Check remote server health
        env:
          REMOTE_SERVER_URL: ${{ secrets.REMOTE_SERVER_URL }}
        run: |
          echo "🏥 Checking remote server health..."
          REMOTE_HEALTH_URL="$(node scripts/resolve-remote-endpoints.js "$REMOTE_SERVER_URL" --field healthUrl)"
          REMOTE_MCP_URL="$(node scripts/resolve-remote-endpoints.js "$REMOTE_SERVER_URL" --field mcpUrl)"

          # Basic connectivity test
          if curl -f -s --max-time 10 "$REMOTE_HEALTH_URL" > /dev/null; then
            echo "✅ Remote server is responding"
          else
            echo "❌ Remote server is not responding"
            exit 1
          fi

          # Test basic MCP protocol
          echo "Testing basic MCP protocol compliance..."

          response=$(curl -s --max-time 30 -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"Health Check","version":"2.0.0"}}}}' \
            "$REMOTE_MCP_URL")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if echo "$body" | grep -q '"result"'; then
            echo "✅ MCP protocol responding correctly"
          elif [ "$http_code" = "401" ] || [ "$http_code" = "403" ] || [ "$http_code" = "429" ]; then
            echo "✅ MCP ingress is reachable and auth-protected (HTTP $http_code)"
          else
            echo "❌ MCP protocol not responding correctly"
            echo "Response: $body"
            echo "HTTP Status: $http_code"
            exit 1
          fi

      - name: Create alert for server downtime
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const title = `🚨 Remote Server Health Check Failed - ${new Date().toISOString()}`;
            const body = `
            The remote Legal MCP server is not responding to health checks.

            **Server URL:** ${{ secrets.REMOTE_SERVER_URL || 'https://courtlistener-mcp.blakeoxford.workers.dev' }}
            **Check Time:** ${new Date().toISOString()}
            **Workflow:** ${{ github.workflow }}

            Please investigate the server status and ensure it's functioning correctly.

            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['critical', 'server-health', 'monitoring']
            });
