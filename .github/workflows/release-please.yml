name: release-please

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: >-
      github.actor != 'dependabot[bot]' &&
      (
        github.actor == github.repository_owner ||
        contains(fromJSON('["blakeox","github-actions[bot]","release-please[bot]","cursor[bot]"]'), github.actor)
      )
    runs-on: [self-hosted, nuc, courtlistener-mcp]
    steps:
      - id: token-check
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [[ -n "${RELEASE_PLEASE_TOKEN}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.token-check.outputs.configured == 'false' }}
        run: echo "Skipping release-please because RELEASE_PLEASE_TOKEN is not configured."

      - if: ${{ steps.token-check.outputs.configured == 'true' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
