name: Setup Node.js and pnpm
description: Install Node from .nvmrc and activate the pinned pnpm via Corepack (avoids broken runner npm).
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: '.nvmrc'

    - name: Install pnpm
      shell: bash
      run: |
        PNPM_VERSION="$(
          node -e "const pm=JSON.parse(require('fs').readFileSync('package.json','utf8')).packageManager; if (!pm?.startsWith('pnpm@')) { process.exit(1) }; process.stdout.write(pm.slice('pnpm@'.length).split('+')[0])"
        )"
        npm install -g "pnpm@${PNPM_VERSION}"

    - name: Restore pnpm cache
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        cache: 'pnpm'
