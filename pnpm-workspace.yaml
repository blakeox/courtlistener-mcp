# Native build scripts are explicit supply-chain approvals for CI installs.
onlyBuiltDependencies:
  - core-js-pure
  - esbuild
  - lefthook
  - workerd

# Exact current toolchain releases approved while they pass through the normal
# release-age window; prune entries once the policy no longer needs them.
minimumReleaseAgeExclude:
  - '@cloudflare/vitest-pool-workers@0.22.0'
  - '@cloudflare/workers-types@5.20260818.1'
  - '@testing-library/user-event@14.6.5'
  - '@vitest/expect@4.1.11'
  - '@vitest/mocker@4.1.11'
  - '@vitest/pretty-format@4.1.11'
  - '@vitest/runner@4.1.11'
  - '@vitest/snapshot@4.1.11'
  - '@vitest/spy@4.1.11'
  - '@vitest/utils@4.1.11'
  - 'agents@0.21.0'
  - 'miniflare@5.20260815.0-alpha'
  - 'vitest@4.1.11'
  - 'wrangler@4.124.0'
overrides:
  '@babel/core': 8.0.1
  brace-expansion: 5.0.9
  body-parser: 2.3.0
  fast-uri: 3.1.5
  hono: 4.12.34
  ip-address: 10.5.0
  '@eslint/eslintrc>ajv': 6.14.0
  eslint>ajv: 6.14.0
  '@protobufjs/utf8@<=1.1.0': '>=1.1.1'
  ajv@<6.14.0: '>=6.14.0'
  brace-expansion@<1.1.13: '>=1.1.13'
  'brace-expansion@>=2.0.0 <2.0.3': '>=2.0.3'
  'flatted@<3.4.0': '>=3.4.0'
  'flatted@<=3.4.1': '>=3.4.2'
  minimatch@<3.1.3: '>=3.1.3'
  minimatch@<3.1.4: '>=3.1.4'
  'minimatch@>=9.0.0 <9.0.6': '>=9.0.6'
  'minimatch@>=9.0.0 <9.0.7': '>=9.0.7'
  'picomatch@>=4.0.0 <4.0.4': '>=4.0.4'
  postcss@<8.5.10: '>=8.5.10'
  protobufjs@<7.5.5: '>=7.5.5'
  protobufjs@<=7.5.5: '>=7.5.6'
  protobufjs@<=7.5.7: '>=7.5.8'
  qs@<6.14.1: '>=6.14.1'
  'qs@>=6.7.0 <=6.14.1': '>=6.14.2'
  'qs@>=6.11.1 <=6.15.1': '>=6.15.2'
  'undici@>=7.0.0 <7.24.0': '>=7.24.0'
  'undici@>=7.17.0 <7.24.0': '>=7.24.0'
  'yaml@>=2.0.0 <2.8.3': '>=2.8.3'
